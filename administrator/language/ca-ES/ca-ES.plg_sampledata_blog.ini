PLG_SAMPLEDATA_BLOG="Dades d'exemple - blog"
PLG_SAMPLEDATA_BLOG_OVERVIEW_DESC="Les dades d'exemples configuraran un lloc amb blogs. <br> Si el lloc és multilingüe, les dades seran etiquetades a l'idioma de l'usuari."
PLG_SAMPLEDATA_BLOG_OVERVIEW_TITLE="Dades d'exemple de blog"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_INTROTEXT="<p> Això us informa una mica sobre aquest blog i la persona que l'escriu.</p><p> Quan hagis entrat podràs editar aquesta pàgina fent clic a la icona d'edició. </p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_TITLE="Sobre"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_INTROTEXT="<p> Aquests són alguns consells bàsics per treballar al teu lloc.</p><ul><li> Joomla! té una 'portada' que estàs veient ara i un 'administrador' o 'posterior' on és on fas el treball més avançat de crear el teu lloc web, com ara configurar els menús i decidir quins mòduls es mostraran. Has d'entrar a l'administrador per separat utilitzant el mateix nom d'usuari i contrasenya que has utilitzat per iniciar sessió en aquesta part del lloc.</li><li> Una de les primeres coses que probablement voldràs fer és canviar el títol del lloc i etiqueta i afegir un logotip. Per fer-ho, fes clic a l'enllaç Configuració de plantilla al menú superior. Per canviar la descripció del lloc, el títol del navegador, el correu electrònic predeterminat i altres elements, fes clic a Configuració del lloc. Les opcions de configuració més avançades estan disponibles a l'administrador.</li> <li> Per canviar totalment l'aspecte del teu lloc, probablement voldràs instal·lar una nova plantilla. Al menú d'extensions, fes clic al Gestor d'extensions i després vés a la pestanya Instal·lar. Hi ha moltes plantilles gratuïtes i comercials disponibles per a Joomla.</li><li>Com ja has vist, pots controlar qui pot veure les diferents parts del teu lloc. Quan treballis amb mòduls, articles o enllaços web que estableixin el nivell d'accés als Registrats, els usuaris només podran veure's </li><li> Quan creis un article nou o un altre tipus de contingut, també pots desar-lo com a publicat o no publicat. Si és un lloc no publicat els visitants no podran veure-ho, però ho faran.</li><li>Pots aprendre molt més sobre treballar amb Joomla des del <a href='https://docs.joomla.org/'> Lloc de documentació de Joomla </a> i obté ajuda d'altres usuaris als <a href='https://forum.joomla.org/'> fòrums de Joomla </a>. A l'administrador hi ha botons d'ajuda a cada pàgina que proporcionen informació detallada sobre les funcions d'aquesta pàgina.</li></ul>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_TITLE="Treballant al teu lloc"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROTEXT="<p> Aquesta és una publicació d'exemple al blog. </p><p>Si entres (l'enllaç \"Accés de l'autor\" es troba a la part inferior d'aquesta pàgina), podràs editar-lo igual que tots els altres articles existents. També podràs crear un nou article i fer altres canvis al lloc. </p><p>A mesura que afegeixis i modifiquis els articles, veuràs com canvia el teu lloc i també com podràs personalitzar-lo de diverses maneres. </p> <p> Segueix endavant, no pots aturar-ho. </p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_TITLE="Benvingut al teu blog"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FULLTEXT="<p>A la pàgina completa podràs veure tant el contingut introductori com la resta de l'article. Pots canviar la configuració per amagar la introducció, si vols.</p> <p></p> <p></p> <p></p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_INTROTEXT="<p> La teva pàgina d'inici està configurada per mostrar els quatre articles més recents de la categoria del blog d'una columna. A continuació, hi ha enllaços als 4 primers articles més antics. Pots canviar aquests números editant la configuració d'opcions de contingut a la pestanya del blog de l'administrador del teu lloc. Hi ha un enllaç al vostre administrador del lloc al menú superior. </p><p>Si vols que la teva entrada al blog es divideixi en dues parts, introdueix una pàgina separada i, a continuació, una altra, utilitza el botó Més informació per inserir un canvi de pàgina</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_TITLE="Sobre la teva pàgina d'inici"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_INTROTEXT="<p> El teu lloc té alguns mòduls d'ús comú ja preconfigurats. Això inclou:</p><ul><li>Mòdul d'imatges que sosté la imatge sota el menú. Aquest és un mòdul personalitzat que pots editar per canviar la imatge.</li><li>Articles més llegits que inclouen articles en funció del nombre de vegades que han estat llegits.</li><li>Articles anteriors que enumera articles per mes.</li><li>Sindicació que permet als lectors llegir les teves publicacions en un lector de notícies.</li><li> Etiquetes populars, que apareixeran si utilitzes etiquetatge als teus articles. Només cal que introdueixis una etiqueta al camp Etiquetes quan l'editis.</li></ul><p> Cada un d'aquests mòduls té moltes opcions amb què pots experimentar amb el gestor de mòduls de l'administració del teu lloc. Movent el ratolí sobre un mòdul i fent clic a la icona d'edició et portarà a una pantalla d'edició d'aquest mòdul. Sempre assegura't de desar i tancar qualsevol mòdul que editis.</p><p>Joomla! també inclou molts altres mòduls que pots incorporar al teu lloc. Mentre desenvolupis el teu lloc, potser vols afegir més mòduls que trobaràs al <a href='https://extensions.joomla.org/'> Directori d'extensions de Joomla </a></p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_TITLE="Els teus mòduls"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_INTROTEXT="<p> Les plantilles controlen l'aparença del teu lloc web. </p> <p> Aquest blog s'instal·la amb la plantilla Protostar. </p><p> Pots editar les opcions fent clic a Treballar al teu lloc, en l'enllaç de configuració de la plantilla al menú superior (visible quan entris).</p><p>Per exemple, pots canviar el color del fons del lloc, destaca el color, el títol del lloc, la descripció del lloc i el tipus de lletra del títol utilitzat.</p><p> Hi ha més opcions disponibles a l'administració del lloc. També pots instal·lar una nova plantilla mitjançant l'administrador d'extensió.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_TITLE="La teva plantilla"
