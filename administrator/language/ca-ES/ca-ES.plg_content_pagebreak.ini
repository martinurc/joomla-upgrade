PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="Permet la creació d'un article amb paginació amb taula de continguts opcional.<br /><br />Insereix salts de pàgina a partir de l'ús del botó de l'editor WYSIWYG . El salt de pàgina es mostrarà a la finestra de text com una simple línia horitzontal. <br /><br />El text mostrat dependrà de les opcions triades i potser del títol, el text alternatiu (si n'hi ha) o els números de pàginació<br /><br /> L'ús del codi HTML és el següent: <br />&lt;hr class=\"system-pagebreak\" /&gt;<br />&lt;hr class=\"system-pagebreak\" title=\"Títol de la pàgina\" /&gt; or <br />&lt;hr class=\"system-pagebreak\" alt=\"La primera pàgina\" /&gt; o <br />&lt;hr class=\"system-pagebreak\" title=\"Títol de la pàgina\" alt=\"La primera pàgina\" /&gt; o <br />&lt;hr class=\"system-pagebreak\" alt=\"La primera pàgina\" title=\"Títol de la pàgina\" /&gt;"
