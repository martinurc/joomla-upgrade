COM_CPANEL_MESSAGES_TITLE="Tens missatges post-instal·lació"
COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Joomla es subministra amb enduriments de seguretat addicionals als fitxers htaccess.txt i web.config.txt per defecte. Aquests enduriments inhabiliten l’anomenada característica de l’espera de tipus MIME en els navegadors web. El sniffing porta a vectors d'atac específics, on s'executaran seqüències d'ordres en formats de fitxer normalment inofensius (per exemple, imatges), cosa que donarà lloc a vulnerabilitats de cross-site-scripting. </p><p> L’equip de seguretat recomana aplicar manualment els canvis necessaris als fitxers .htaccess o web.config existents, ja que aquests fitxers no es poden actualitzar automàticament.</p><p><strong>Canvis per a .htaccess</strong><br />Afegeix les següents línies abans de \"## Mod_rewrite en ús.\":</p><pre>&lt;IfModule mod_headers.c&gt;\nLa capçalera sempre posa X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>Canvis per a web.config</strong><br />Afegeix les següents línies després \"&lt;/rewrite&gt;\":</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>"
COM_CPANEL_MSG_ADDNOSNIFF_TITLE="Actualització de seguretat .htaccess & web.config"
COM_CPANEL_MSG_EACCELERATOR_BODY="eAccelerator no és compatible amb Joomla!. Clicant el canvi al botó de Captar arxius, canviarem el caxè a l'arxiu.Si vols un caxè diferent, canvia'l a la pàgina de configuració Global."
COM_CPANEL_MSG_EACCELERATOR_BUTTON="Canviar al fitxer."
COM_CPANEL_MSG_EACCELERATOR_TITLE="eAccelerator no és compatible amb Joomla!"
COM_CPANEL_MSG_HTACCESS_BODY="Es va fer un canvi als arxius .htaccess i web.config per defecte a Joomla! 3.4 per no permetre llistats de directoris per defecte.  Es recomana als usuaris aplicar aquest canvi als seus arxius.  Mira <a href=\"https://docs.joomla.org/Special:MyLanguage/Preconfigured_htaccess\">aquesta pàgina</a> per a més informació."
COM_CPANEL_MSG_HTACCESS_TITLE="Actualització de .htaccess i web.config"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="Protecció XSS addicional per l'ús d'arxius SVG"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Des de 3.9.21 Joomla té una seguretat adicional a l'arxiu per defecte htaccess.txt. Aquesta norma protegeix els usuaris de l'ús de la vulnerabilitat de XSS amb SVG.<br>L'equip de seguretat recomana aplicar manualment els canvis a qualsevol arxiu .htaccess file, ja que no es pot fer automaticament.</p><p><strong>Canvis per a .htaccess</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    L'encapçalament té sempre esablerta la política de seguretat de contingut \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p> Actualment no podem assegurar un mètode de configuració als servidors web IIS,  contacta amb el teu proveïdor d'hostatjament per a més assistència.</p>"
COM_CPANEL_MSG_JOOMLA40_PRE_CHECKS_TITLE="Preparar-se pel proper llançament major de Joomla"
COM_CPANEL_MSG_JOOMLA40_PRE_CHECKS_BODY="<p>Des de Joomla! 4.0 estem augmentant els requeriments mínims del servidor. Si estàs veient aquest missatge vol dir que la teva configuració actual no conté aquests nous mínims.</p><p>Els<a href=\"https://developer.joomla.org/news/788-joomla-4-on-the-move.html\"><strong> requisits mínims</strong></a> són els següents:</p><ul><li>PHP 7.2.5.</li><li>MySQL 5.6</li><li>MariaDB 10.1</li><li>PostgreSQL 11.0</li><li>MS SQL <strong>no</strong> serà compatible</li><li>MySQL utilitzant l'extensió PHP 'ext/mysql' <strong>no</strong> serà suportat, ni els drivers MySQLi o \"MySQL (PDO)\" driver s'ha d'utilitzar al seu lloc</li><li>PostgreSQL utilitzant l'extensió PHP 'ext/pgsql' <strong>no</strong> serà compatible, el driver \"PostgreSQL (PDO)\" s'ha d'utilitzar al seu lloc</li></ul><p>Contacta amb el teu proveïdor per preguntar com pots conèixer si complireu amb els requisits del servidor - en general és un canvi molt simple. Si ja compleixes aquests requisits nous llavors aquest missatge no es mostrarà.</p>"
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="Tens possibles problemes amb la configuració multilingüe"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Des de Joomla 3.4.0 pots tenir problemes amb el complement Sistema - Filtrat d'idioma.Per arreglar-ho obre el <a href=\"index.php?option=com_languages&view=languages\">Gestor d'idiomes</a> i guarda cada idioma de contingut manualment per assegurar-te del nivell d'accés."
; The following two strings are deprecated and will be removed with 4.0
COM_CPANEL_MSG_PHPVERSION_BODY="Començant amb Joomla! 3.3, la versió PHP d'aquest lloc no es suportarà. Joomla! 3.3 requerirà almenys <a href=\"http://community.joomla.org/blogs/leadership/1798-raising-the-bar-on-security.html\">la versió PHP 5.3.10 per tal de donar característiques de seguretat als seus usuaris</a>."
COM_CPANEL_MSG_PHPVERSION_TITLE="La teva versió PHP no es suportarà amb Joomla! 3.3"
COM_CPANEL_MSG_ROBOTS_TITLE="Actualització de robots.txt "
COM_CPANEL_MSG_ROBOTS_BODY="S'ha fet un canvi als arxius robots.txt per defecte des de Joomla! 3.3 per permetre a Google accedir a les plantilles i mitjans per millorar el SEO. Aquest canvi no s'aplica automàticament a les actualitzacions i es recomana als usuaris revisar els canvis al fitxer robots.txt.dist i implementar-los al seu propi fitxer robots.txt ."
COM_CPANEL_MSG_STATS_COLLECTION_BODY="Des de Joomla! 3.5 un complement d'estadística presenta dades anònimes al projecte Joomla. Això només presentarà la versió PHP, el motor de base de dades i versió i sistema operatiu del servidor.</p><p>Aquestes dades es recullen per assegurar que les futures versions de Joomla poden prendre avantatge de la darrera base de dades i característiques de PHP sense efectuar un nombre significatiu de canvis. La necessitat d'això es va fer evident quan un mínim de PHP 5.3.10 era necessari per executar Joomla! 3.3 implementant les contrasenyes més segures de Bcrypt.</p><p>En nom de la plena transparència i per ajuda als desenvolupadors <a href=\"https://developer.joomla.org/about/stats.html\"> aquestes dades estan disponibles públicament.</a> Un API i gràfics mostraran la versió de Joomla, versions PHP i motors de base de dades en ús.</p><p>Si no vols donar al projecte Joomla aquesta informació pots deshabilitar el complement anomenat Sistema - Estadístiques de Joomla.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Recollida d'estadístiques a Joomla"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>Com a part de la nostra revisió de seguretat, hem fet alguns canvis a les configuracions per defecte als filtres globals de text en una instal·lació nova de Joomla. Per a 'Públic', 'Convidat' i 'Registrat' ara serà 'No HTML'. Si no és una instal·lació nova et recomanem que facis aquests canvis des de : Sistema -> Configuració Global -> Filtres de text</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Recomanacions per a filtres de text actualitzades"
COM_CPANEL_MSG_UPDATEDEFAULTSETTINGS_BODY="<p> Com a part de la revisió de l'equip de seguretat, hem realitzat alguns canvis a la configuració predeterminada d'una nova instal·lació de Joomla. Com que aquests canvis només s'apliquen a noves instal·lacions, et recomanem que revisis aquests canvis i actualitzis el lloc web. </p><p> Els paràmetres canviats són: </p><ul><li> Configuració global > Filtres de text: El grup d'usuaris \"Administrador\" per defecte ha canviat de \"Sense filtre\" a \"Llista negra predeterminada\" </li><li> Usuaris > Enviar contrasenya: l'opció d'enviar a un usuari la seva contrasenya en text pla quan un compte ha sigut creat, està desactivada per defecte </li><li> Gestor de mitjans: no es permet carregar fitxers Flash (\"swf\" extensió de fitxer i \"application/x-shockwave-flash\" MIME Type), no estan permesos per a ser pujats </li><li> Articles > Mostra correu electrònic: l'opció per mostrar una icona de correu electrònic en els articles està desactivada de manera predeterminada </li></ul><p> Hem creat una <a href=\"https://docs.joomla.org/Special:MyLanguage/J3.x:Joomla_3.8.8_notes_about_the_changed_default_settings\"> pàgina de documentació dedicada </a> que explica aquests canvis. </p>"
COM_CPANEL_MSG_UPDATEDEFAULTSETTINGS_TITLE="Actualitzades les recomanacions de seguretat del lloc web"
COM_CPANEL_WELCOME_BEGINNERS_MESSAGE="<p>Els recursos de la comunitat estan disponibles pels nous usuaris</p><ul><li><a href=\"https://docs.joomla.org/Special:MyLanguage/Portal:Beginners\">Guia de Novells Joomla!</a></li><li><a href=\"http://forum.joomla.org/viewforum.php?f=706\">Nou al fòrum Joomla!</a></li><ul>"
COM_CPANEL_WELCOME_BEGINNERS_TITLE="Benvingut/da a Joomla!"
