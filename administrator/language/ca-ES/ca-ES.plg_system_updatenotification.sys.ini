PLG_SYSTEM_UPDATENOTIFICATION="Sistema - Notificació d'actualització Joomla"
PLG_SYSTEM_UPDATENOTIFICATION_XML_DESCRIPTION="Aquest complement comprova periòdicament la disponibilitat de noves versions. Quan se'n troba una t'enviarà un correu electrònic, recordant-te actualitzar Joomla!. Consell: Pots personalitzar el missatge de correu electrònic canviant les cadenes PLG_SYSTEM_UPDATENOTIFICATION_EMAIL_SUBJECT i PLG_SYSTEM_UPDATENOTIFICATION_EMAIL_BODY."
