EB_ENABLE_FULL_PAYMENT="Enable Full Payment"
EB_ENABLE_FULL_PAYMENT_EXPLAIN="Set to No if you only want to allow users to make deposit payment at the time they register for the event"
EB_DEFAULT_PAYMENT_TYPE="Default Payment Type"
