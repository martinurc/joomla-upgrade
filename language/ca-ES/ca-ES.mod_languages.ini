MOD_LANGUAGES_XML_DESCRIPTION="Aquest mòdul mostra una llista d'idiomes de contingut disponibles (definits i publicats a la pestanya del gestor d'idiomes) per a poder seleccionar entre ells quan un vol fer servir Joomla! com un lloc multi-idiomes. <br/> - El complement 'Sistema - Filtrar idioma' ha d'estar activat.-- <br/> Quan es canvia entre idiomes i si l'ítem mostrat a la pàgina no està associat a un altre ítem el mòdul redirecciona cap a la pàgina d'inici definida per a aquest idioma.<br /> D'altra banda si el paràmetre està definit al complement de filtre d'idiomes et portarà a l'article en aquell idioma i només es mostrarà contingut configurat en aquest idioma. <br/> Si el complement <strong>'Sistema - Filtrar idioma'</strong> no està publicat, pot ocasionar resultats inesperats. <br/> <strong> Mètode: </strong> <br/> 1. Obre la pestanya del gestor d'idiomes i assegura't que els idiomes de contingut estan publicats i tenen un codi d'idioma per l'adreça URL, així com el prefix per la imatge utilitzada al mòdul selector de l'idioma. <br/> 2. Crea una pàgina d'inici assignant un idioma a un element de menú, i estableix per defecte de la pàgina d'inici per cada idioma de contingut publicat. <br/> 3. A partir d'aquí, pots assignar un idioma a qualsevol article, categoria, mòdul, canal electrònic, o enllaç web de Joomla!. <br/> 4. Assegura't que tant el mòdul com el complement estan habilitats.<br />5. Quan utilitzis ítems associats, assegura't que el mòdul es mostra a les pàgines importants. <br />6. L'ordre d'aparició de les banderes es defineix a Gestor d'idiomes - Idiomes de contingut.<br ><br >Si es publica aquest mòdul, es suggereix que es publiqui també el mòdul d'administració de l'estat de l'idioma."
