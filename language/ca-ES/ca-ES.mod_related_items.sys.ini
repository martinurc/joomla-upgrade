MOD_RELATED_ITEMS="Articles - Relacionats"
MOD_RELATED_XML_DESCRIPTION="Aquest mòdul permet mostrar altres articles relacionats amb el que actualment s'estigui mostrant. Aquesta relació s'estableix per mitjà de les metaparaules clau. <br/> Totes les paraules clau de l'article actual seran confrontades amb totes les paraules clau de la resta d'articles que actualment estiguin publicats. Per exemple,imaginem que tens un article sobre \" L'hàbitat natural dels lloros \" i un altre sobre \" Aliments bàsics per al canari \". Si inclous la paraula clau \" aus \" en tots dos articles, el mòdul d'articles relacionats llistarà l'article \" L'hàbitat natural dels lloros \" mentre estigueu veient el de \" Aliments bàsics per al canari \" i a l'inrevés. "
MOD_RELATED_ITEMS_LAYOUT_DEFAULT="Predeterminat"
