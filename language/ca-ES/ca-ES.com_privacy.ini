COM_PRIVACY_CONFIRM_REMIND_SUCCEEDED="El teu consentiment a la Política de privadesa d’aquest lloc web s’ha ampliat."
COM_PRIVACY_CONFIRM_REQUEST_FIELDSET_LABEL="S'ha enviat un correu electrònic a la teva adreça de correu electrònic. El correu electrònic té un testimoni de confirmació, confirma de nou la vostra adreça de correu electrònic i enganxa el testimoni de confirmació al camp següent per demostrar que ets el propietari de la informació sol·licitada."
COM_PRIVACY_CONFIRM_REQUEST_SUCCEEDED="La teva petició d'informació ha estat confirmada. Processarem la teva petició tan aviat com sigui possible i s'exportarà cap al teu correu electrònic."
COM_PRIVACY_CREATE_REQUEST_SUCCEEDED="S'ha creat la sol·licitud d'informació. Abans que es pugui processar, has de verificar-la. S'ha enviat un correu electrònic a la teva adreça amb instruccions addicionals per completar aquesta verificació."
; You can use the following merge codes for all COM_PRIVACY_EMAIL strings:
; [SITENAME]  Site name, as set in Global Configuration.
; [URL]       URL of the site's frontend page.
; [TOKENURL]  URL of the confirm page with the token prefilled.
; [FORMURL]   URL of the confirm page where the user can paste their token.
; [TOKEN]     The confirmation token.
; \n          Newline character. Use it to start a new line in the email.
COM_PRIVACY_EMAIL_REQUEST_BODY_EXPORT_REQUEST="Algú ha creat una sol·licitud per exportar tota la informació personal relacionada amb aquesta adreça de correu electrònic a [URL]. Com a mesura de seguretat, has de confirmar que es tracta d’una sol·licitud vàlida per a la teva informació personal des d’aquest lloc web.\n\n Si ha estat un error, ignora aquest missatge.\n\n Per confirmar aquesta sol·licitud, pots completar una de les tasques següents:\n\n1. Visita la següent URL: [TOKENURL]\n\n2. Copia el teu testimoni des d’aquest correu electrònic, visita l’URL de referència i enganxa el testimoni al formulari. \nURL: [FORMURL]\nToken: [TOKEN]\n\nTingues en compte que aquest testimoni només és vàlid durant 24 hores a partir del moment que s'ha enviat aquest correu electrònic."
COM_PRIVACY_EMAIL_REQUEST_BODY_REMOVE_REQUEST="Algú ha creat una sol·licitud per eliminar tota la informació personal relacionada amb aquesta adreça de correu electrònic a [URL]. Com a mesura de seguretat, has de confirmar que es tracta d’una sol·licitud vàlida per a la teva informació personal des d’aquest lloc web.\n\n Si ha estat un error, ignora aquest missatge.\n\n Per confirmar aquesta sol·licitud, pots completar una de les tasques següents:\n\n1. Visita la següent URL: [TOKENURL]\n\n2. Copia el vostre testimoni des d’aquest correu electrònic, visita l’URL de referència i enganxa el testimoni al formulari. \nURL: [FORMURL]\nToken: [TOKEN]\n\nTingues en compte que aquest testimoni només és vàlid durant 24 hores a partir del moment que s'ha enviat aquest correu electrònic."
